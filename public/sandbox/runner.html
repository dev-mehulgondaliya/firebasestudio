<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Firebase Studio sandbox</title>
  </head>
  <body>
    <!--
      Loaded by Studio inside <iframe sandbox="allow-scripts">: this document has
      an opaque origin, so it cannot read Studio's cookies, storage or DOM.
      User scripts run one level deeper, in a Web Worker created here, so a
      runaway script can always be terminated.
    -->
    <script src="./runner.js"></script>
  </body>
</html>
